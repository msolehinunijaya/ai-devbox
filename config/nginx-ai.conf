# AI Devbox previews, reachable only over Tailscale.
# setup.sh renders this to /etc/nginx/sites-available/ai-devbox, replacing
#   __TS_IP__      Tailscale IPv4 of this server, e.g. 100.101.102.103
#   __TS_DASHED__  the same IP with dashes, e.g. 100-101-102-103
#   __TS_NAMES__   MagicDNS names of this server, e.g. claude-dev claude-dev.tailnet.ts.net
# http://<job>.__TS_DASHED__.sslip.io  ->  /var/www/ai-devbox/run/docroot/<job>  (symlink to the worktree's web root)
server {
    listen __TS_IP__:80;
    server_name ~^(?<job>[a-z0-9-]+)\.__TS_DASHED__\.sslip\.io$;
    root /var/www/ai-devbox/run/docroot/$job;
    index index.php index.html;
    client_max_body_size 20m;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~ /\.(?!well-known) { deny all; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-ai.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}

# Dashboard: http://__TS_IP__/, http://ai.__TS_DASHED__.sslip.io/ or the MagicDNS names below.
server {
    listen __TS_IP__:80;
    server_name __TS_IP__ ai.__TS_DASHED__.sslip.io __TS_NAMES__;
    client_max_body_size 1m;
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:7070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
