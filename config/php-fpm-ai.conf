; AI Devbox preview pool. Installed by setup.sh as /etc/php/8.4/fpm/pool.d/ai.conf.
; Previews run as the unprivileged ai user, separate from the www pool that serves the live site.
[ai]
user = ai
group = ai
listen = /run/php/php8.4-fpm-ai.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Workers start on demand and exit when idle, so the pool costs no RAM between previews.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 200

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
